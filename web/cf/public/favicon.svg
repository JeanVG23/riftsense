<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Radiant Saturated Celestial Gold -->
    <linearGradient id="rsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="20%" stop-color="#ffd864"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#df9b24"/>
      <stop offset="100%" stop-color="#8e540f"/>
    </linearGradient>

    <!-- Deep Celestial Night Core -->
    <radialGradient id="rsSky" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#2e1f26"/>
      <stop offset="65%" stop-color="#181014"/>
      <stop offset="100%" stop-color="#0d070a"/>
    </radialGradient>

    <!-- Mountain Left Shaded Face -->
    <linearGradient id="rsMtnL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#423238"/>
      <stop offset="100%" stop-color="#1c1317"/>
    </linearGradient>

    <!-- Mountain Right Sunlit Face -->
    <linearGradient id="rsMtnR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#786068"/>
      <stop offset="50%" stop-color="#524047"/>
      <stop offset="100%" stop-color="#2a1e24"/>
    </linearGradient>

    <!-- Star Radiant Aura -->
    <radialGradient id="rsAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffd864" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#e29b1f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e29b1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Celestial Base Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#rsSky)"/>
  <!-- Primary Solid Gold Astrolabe Ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#rsGold)" stroke-width="2"/>
  <!-- Inner Fine Dashed Celestial Measurement Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#rsGold)" stroke-width="0.8" stroke-dasharray="1.5 2.5" opacity="0.7"/>

  <!-- Astrolabe Celestial Orbit Ellipses -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="url(#rsGold)" stroke-width="1.4" opacity="0.6" transform="rotate(-25 32 32)"/>
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="url(#rsGold)" stroke-width="1.4" opacity="0.6" transform="rotate(25 32 32)"/>

  <!-- Cardinal Solar Pointers (North, South, East, West) -->
  <line x1="32" y1="1.5" x2="32" y2="6.5" stroke="url(#rsGold)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="32" y1="57.5" x2="32" y2="62.5" stroke="url(#rsGold)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="1.5" y1="32" x2="6.5" y2="32" stroke="url(#rsGold)" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="57.5" y1="32" x2="62.5" y2="32" stroke="url(#rsGold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Mont Targon: Majestic Sharp Monolith -->
  <!-- Left Shadow Flank -->
  <path d="M32 18 L16 54 L32 50 Z" fill="url(#rsMtnL)"/>
  <!-- Right Light Flank -->
  <path d="M32 18 L32 50 L48 54 Z" fill="url(#rsMtnR)"/>
  <!-- Central Knife-Edge Ridge -->
  <line x1="32" y1="18" x2="32" y2="50" stroke="url(#rsGold)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Monolith Edges -->
  <path d="M16 54 L32 18 L48 54" fill="none" stroke="url(#rsGold)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Secondary Bastion Foothills -->
  <path d="M10 57 L17 46 L25 53 Z" fill="#1e1418" stroke="url(#rsGold)" stroke-width="0.8" opacity="0.85"/>
  <path d="M39 53 L47 45 L54 57 Z" fill="#261a20" stroke="url(#rsGold)" stroke-width="0.8" opacity="0.85"/>

  <!-- Star Radiant Aura Glow -->
  <circle cx="32" cy="14" r="9" fill="url(#rsAura)"/>

  <!-- 8-Pointed Celestial Beacon Star (Ascension & Vision) -->
  <!-- Primary Cardinal Rays -->
  <path d="M32 3 L35 12 L43 14 L35 16 L32 25 L29 16 L21 14 L29 12 Z" fill="url(#rsGold)"/>
  <!-- Diagonal Secondary Rays -->
  <path d="M32 8.5 L34 12.5 L38 14 L34 15.5 L32 19.5 L30 15.5 L26 14 L30 12.5 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Radiant Core Spark -->
  <circle cx="32" cy="14" r="2" fill="#ffffff"/>
</svg>